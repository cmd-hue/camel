- number: 1 
  name: Program Guide
  abbr: GUIDE
  title: Prevue Guide
  noise: 0.1
  backgroundAudio: https://cmd-hue.github.io/camel/musicvoice/music.pls
  backgroundAudioOptions:
    shufflePlaylist: true
  v-split: # Program guides are traditionally split in half; the top half is advertising and the lower half is the guide data. We use the v-split layout which defines two components, A and B.
    a: # A is the top part. See: https://greenhillplaza.notion.site/Layouts-728ab1198d4049de8f4b9a4ff6b31efe?pvs=4
      loop:
      - slideshow:
          duration: 3.14
          images:
            - ./ads/catdog-dvd-request.png
            - ./ads/cnplus.png
            - ./ads/vidtape.png
            - ./ads/lazioh.png
            - ./ads/videofeat.png
            - ./ads/beeco.png
            - ./ads/windowsfamily.png
            - https://file.garden/aUYIWVAKvQxCBY-_/tvs/istelod.png
            - https://file.garden/aUYIWVAKvQxCBY-_/tvs/zoopelodeon.png
            - https://file.garden/aUYIWVAKvQxCBY-_/tvs/skodwarde.png
    b: # B is the bottom part
      guide: # Program guides read the current channel lineup to reconstruct listings based off channel numbers, title and description. https://greenhillplaza.notion.site/Program-Guides-46e80919a3754efa9769f74dd00946fe?pvs=4
        logo: ./logo.svg # Logo to show at the top of the guide
        alerts: # "Alerts" that show up at certain positions in the guide.
          - position: 12 # The channel to show the alert after. Doesn't need to be a real channel.
            text: |
              If any channels aren't working, contact a staffmember.
          - position: 100
            text: | # You can define text over multiple lines but it'll be compressed to a single line.
              Warning: Piracy is a crime and could get you a few years in prison. Do NOT Do It.

